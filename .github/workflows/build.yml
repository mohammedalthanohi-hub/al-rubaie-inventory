name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب ملفات المشروع من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت بيئة جافا (JDK 17) المطلوبة لأندرويد الحديث
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. تثبيت وتجهيز Gradle تلقائياً (يعوض نقص gradlew في مشروعك)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # 4. بناء ملف التطبيق بصيغة APK (نسخة تجريبية Debug)
      - name: Build Debug APK
        run: gradle assembleDebug

      # 5. رفع ملف الـ APK الناتج لتتمكن من تحميله وتثبيته على هاتفك
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rubai-Market-Inventory-APK
          path: app/build/outputs/apk/debug/app-debug.apk
